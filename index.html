<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 기초 학습 퀴즈</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>보안 기초 학습 퀴즈</h1><p>정보보안 기초 개념을 퀴즈로 복습하는 웹페이지</p></header>
  <main>
    <section class="panel" aria-labelledby="intro-title">
      <h2 id="intro-title">서비스 소개</h2>
      <p>정보보안을 처음 배우는 대학생을 위한 간단한 학습 서비스입니다. 문제를 풀고, 틀린 문제는 오답 노트에서 다시 확인할 수 있습니다.</p>
      <p id="progress" class="muted" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="quiz-title">
      <h2 id="quiz-title">기초 보안 퀴즈</h2>
      <p id="question-category" class="tag"></p>
      <h3 id="question-title"></h3>
      <form id="quiz-form">
        <fieldset><legend>정답을 하나 선택하세요.</legend><div id="choices"></div></fieldset>
        <p id="quiz-message" class="message" role="status" aria-live="polite"></p>
        <div class="actions"><button type="submit" id="submit-answer">정답 확인</button><button type="button" id="next-question" class="secondary" hidden>다음 문제</button><button type="button" id="restart-quiz" class="secondary">퀴즈 처음부터</button></div>
      </form>
    </section>
    <section class="panel" aria-labelledby="review-title">
      <h2 id="review-title">오답 노트 <span class="new-label">중간고사 추가 기능</span></h2>
      <p>틀린 문제는 자동으로 오답 노트에 저장됩니다. 분야별로 확인하고, 복습한 문제는 완료 처리할 수 있습니다.</p>
      <label for="category-filter">분야 선택</label>
      <select id="category-filter"><option value="all">전체 분야</option><option value="계정 보안">계정 보안</option><option value="네트워크">네트워크</option><option value="웹 보안">웹 보안</option></select>
      <p id="review-status" class="muted" aria-live="polite"></p>
      <ul id="review-list"></ul>
      <div class="actions"><button type="button" id="clear-reviews" class="danger">오답 노트 전체 삭제</button><button type="button" id="undo-clear" class="secondary" hidden>삭제 취소</button></div>
    </section>
  </main>
  <footer>웹프로그래밍 중간고사 프로토타입 · 학습용 예시</footer>
</body>
</html>
